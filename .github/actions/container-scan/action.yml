name: 'DevSecOps Container Scan (Trivy + OSV-Scanner + OpenGrep + Hadolint)'
description: >
  Builds the caller's Docker image, then lints the Dockerfile (Hadolint +
  OpenGrep) and scans the built image (Trivy + OSV-Scanner). Reusable from
  any repository -- pulls the scanner scripts from this toolkit repo at a
  pinned ref. Note: ci/container_scan.py always targets a file literally
  named `Dockerfile` in project-directory (this is hardcoded upstream in
  the shared script, which this action intentionally does not modify).

inputs:
  toolkit-repository:
    required: false
    default: ${{ github.repository }}
  toolkit-ref:
    required: false
    default: ${{ github.sha }}
  python-version:
    required: false
    default: '3.14.4'
  project-directory:
    description: 'Directory containing the Dockerfile to build and scan, relative to the caller repo root'
    required: false
    default: '.'
  image-name:
    required: false
    default: ${{ github.event.repository.name }}:ci
  upload-sarif:
    required: false
    default: 'true'

outputs:
  merged-sarif-path:
    value: ${{ steps.merge.outputs.sarif-path }}

runs:
  using: 'composite'
  steps:
    - name: Checkout DevSecOps toolkit (scanner scripts + rulesets)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ inputs.toolkit-repository }}
        ref: ${{ inputs.toolkit-ref }}
        path: .devsecops-toolkit

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Build Docker image
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: docker build -t ${{ inputs.image-name }} .

    - name: Setup tools
      shell: bash
      working-directory: .devsecops-toolkit
      run: bash ci/setup-tools.sh --install-tool trivy,osv-scanner,opengrep,hadolint,semgrep-rules

    - name: Run Dockerfile SAST scan
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        SEMGREP_CONFIG_RULESETS: ${{ github.workspace }}/.devsecops-toolkit/semgrep-rules/dockerfile auto
        OPENGREP_SAST_SARIF_OUTPUT: sast-opengrep-dockerfile.sarif
        HADOLINT_SAST_SARIF_OUTPUT: sast-hadolint-dockerfile.sarif
      run: python "${GITHUB_WORKSPACE}/.devsecops-toolkit/ci/container_scan.py" --scan-type sast

    - name: Run image SCA scan
      if: always()
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        TRIVY_IGNOREFILE: ${{ github.workspace }}/.devsecops-toolkit/ci/suppress_trivy.yaml
        OSV_IGNOREFILE: ${{ github.workspace }}/.devsecops-toolkit/ci/suppress_osv_scanner.toml
        TRIVY_SCA_SARIF_OUTPUT: sca-trivy-container.sarif
        OSV_SCA_SARIF_OUTPUT: sca-osv-container.sarif
      run: python "${GITHUB_WORKSPACE}/.devsecops-toolkit/ci/container_scan.py" --scan-type sca --image ${{ inputs.image-name }}

    - name: Upload Trivy SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/sca-trivy-container.sarif
        category: trivy-container-scanning

    - name: Upload OSV-Scanner SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/sca-osv-container.sarif
        category: osv-scanner-container-scanning

    - name: Upload OpenGrep SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/sast-opengrep-dockerfile.sarif
        category: opengrep-sast

    - name: Upload Hadolint SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/sast-hadolint-dockerfile.sarif
        category: hadolint-sast

    - name: Merge all SARIF reports
      id: merge
      if: always()
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        python "${GITHUB_WORKSPACE}/.devsecops-toolkit/ci/container_scan.py" \
          --merge-sarif sca-trivy-container.sarif sca-osv-container.sarif \
                         sast-opengrep-dockerfile.sarif sast-hadolint-dockerfile.sarif \
          --merge-output container-scan-merged.sarif
        echo "sarif-path=${{ inputs.project-directory }}/container-scan-merged.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: container-scan-sarif-report
        path: ${{ steps.merge.outputs.sarif-path }}
        retention-days: 30
