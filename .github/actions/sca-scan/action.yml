name: 'SCA Scan'
description: 'Runs SBOM-based SCA scan (Trivy + OSV) and uploads results. Caller sets scan_path and ecosystem via `with:` — no shared config needs editing to onboard a new project.'

inputs:
  scan_path:
    description: 'Path to the directory to scan, relative to repo root (e.g. ".", "test-python"). Required.'
    required: true

  ecosystem:
    description: 'SBOM ecosystem for setup-tools.sh: maven | npm | golang | generic. Required.'
    required: true

  python_version:
    description: 'Python version to use for setup-tools.sh and sca_scan.py.'
    required: false
    default: '3.14.4'

  sbom_path:
    description: 'Path to the generated SBOM file, relative to `scan_path` (mirrors the local toolbox.sh flow, where the project dir is the cwd).'
    required: false
    default: 'target/bom.json'

  trivy_ignorefile:
    description: 'Path to the shared Trivy ignorefile, relative to repo root.'
    required: false
    default: 'ci/suppress_trivy.yaml'
  osv_ignorefile:
    description: 'Path to the shared OSV-Scanner ignorefile, relative to repo root.'
    required: false
    default: 'ci/suppress_osv_scanner.toml'

  trivy_sarif_output:
    description: 'Trivy SARIF filename, written inside `scan_path`.'
    required: false
    default: 'sca-trivy.sarif'
  osv_sarif_output:
    description: 'OSV-Scanner SARIF filename, written inside `scan_path`.'
    required: false
    default: 'sca-osv-scanner.sarif'
  sca_merged_sarif_output:
    description: 'Merged SARIF filename, written inside `scan_path`.'
    required: false
    default: 'sca-merged.sarif'

  artifact_name:
    required: false
    default: 'sca-scan-sarif-report'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        case "${{ inputs.ecosystem }}" in
          maven|npm|golang|generic) ;;
          *)
            echo "::error::ecosystem must be one of: maven, npm, golang, generic (got '${{ inputs.ecosystem }}')." >&2
            exit 1
            ;;
        esac
        if [[ ! -d "${{ inputs.scan_path }}" ]]; then
          echo "::error::scan_path '${{ inputs.scan_path }}' does not exist or is not a directory." >&2
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version }}

    # setup-tools.sh's SBOM generation (mvn/npx/go) takes no path argument --
    # it always operates on the cwd. Locally, toolbox.sh mounts the project
    # dir as the container's WORKDIR (/workspace), so this "just works" there.
    # Native runners have no such mount, so we cd into scan_path here instead.
    # ci/setup-tools.sh itself lives at repo root regardless of scan_path, so
    # it's invoked via the absolute $GITHUB_WORKSPACE path so it still
    # resolves after the cd. --scan-path is "." because we're already in
    # scan_path -- this only matters for the generic/auto ecosystem, where
    # setup-tools.sh runs `trivy fs ... "$SCAN_PATH"`.
    - name: Setup tools
      shell: bash
      working-directory: ${{ inputs.scan_path }}
      run: |
        bash "${GITHUB_WORKSPACE}/ci/setup-tools.sh" \
          --install-tool trivy,osv-scanner \
          --sbom-ecosystem "${{ inputs.ecosystem }}" \
          --scan-path .

    # Same reasoning: sca_scan.py reads SBOM_PATH/*_SARIF_OUTPUT relative to
    # its cwd, so run it from inside scan_path too, via an absolute path.
    # TRIVY_IGNOREFILE/OSV_IGNOREFILE are the shared repo-root config files
    # (same file for every caller, per ci/docker/env/sca.env's comment on
    # why the local flow uses an absolute path for these), so they're
    # anchored to github.workspace regardless of scan_path.
    - name: Run SCA tools
      shell: bash
      working-directory: ${{ inputs.scan_path }}
      run: python "${GITHUB_WORKSPACE}/ci/sca_scan.py"
      env:
        SBOM_PATH: ${{ inputs.sbom_path }}
        TRIVY_IGNOREFILE: ${{ github.workspace }}/${{ inputs.trivy_ignorefile }}
        OSV_IGNOREFILE: ${{ github.workspace }}/${{ inputs.osv_ignorefile }}
        TRIVY_SARIF_OUTPUT: ${{ inputs.trivy_sarif_output }}
        OSV_SARIF_OUTPUT: ${{ inputs.osv_sarif_output }}
        SCA_MERGED_SARIF_OUTPUT: ${{ inputs.sca_merged_sarif_output }}

    - name: Upload merged SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: ${{ inputs.scan_path }}/${{ inputs.sca_merged_sarif_output }}
        category: sca-${{ inputs.scan_path }}

    - name: Upload SARIF artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.scan_path }}/${{ inputs.sca_merged_sarif_output }}
        retention-days: 30