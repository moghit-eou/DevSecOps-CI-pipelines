name: 'DevSecOps SCA (Trivy + OSV-Scanner)'
description: >
  Software Composition Analysis via a CycloneDX SBOM, scanned with Trivy
  and OSV-Scanner. Reusable from any repository -- pulls the scanner
  scripts from this toolkit repo at a pinned ref.

inputs:
  toolkit-repository:
    required: false
    default: ${{ github.repository }}
  toolkit-ref:
    required: false
    default: ${{ github.sha }}
  python-version:
    required: false
    default: '3.14.4'
  project-directory:
    description: 'Directory containing the pom.xml / package.json to scan, relative to the caller repo root'
    required: false
    default: '.'
  sbom-ecosystem:
    description: 'maven or npm'
    required: false
    default: 'maven'
  upload-sarif:
    required: false
    default: 'true'

outputs:
  merged-sarif-path:
    value: ${{ steps.run.outputs.sarif-path }}

runs:
  using: 'composite'
  steps:
    - name: Checkout DevSecOps toolkit (scanner scripts + ignore files)
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ inputs.toolkit-repository }}
        ref: ${{ inputs.toolkit-ref }}
        path: .devsecops-toolkit

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Maven packages
      if: inputs.sbom-ecosystem == 'maven'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-m2-v1-${{ hashFiles(format('{0}/**/pom.xml', inputs.project-directory)) }}
        restore-keys: ${{ runner.os }}-m2-v1-

    - name: Resolve Maven dependencies
      if: inputs.sbom-ecosystem == 'maven'
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: mvn -B -ntp dependency:resolve -q

    - name: Install SCA tools + generate SBOM
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      run: |
        bash "${GITHUB_WORKSPACE}/.devsecops-toolkit/ci/setup-tools.sh" \
          --install-tool trivy,osv-scanner \
          --sbom-ecosystem ${{ inputs.sbom-ecosystem }}

    - name: Run SCA scan
      id: run
      shell: bash
      working-directory: ${{ inputs.project-directory }}
      env:
        SBOM_PATH: target/bom.json
        TRIVY_IGNOREFILE: ${{ github.workspace }}/.devsecops-toolkit/ci/suppress_trivy.yaml
        OSV_IGNOREFILE: ${{ github.workspace }}/.devsecops-toolkit/ci/suppress_osv_scanner.toml
        TRIVY_SARIF_OUTPUT: trivy-app.sarif
        OSV_SARIF_OUTPUT: osv-scanner-app.sarif
        SCA_MERGED_SARIF_OUTPUT: sca-app-merged.sarif
      run: |
        python "${GITHUB_WORKSPACE}/.devsecops-toolkit/ci/sca_scan.py"
        echo "sarif-path=${{ inputs.project-directory }}/sca-app-merged.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload Trivy SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/trivy-app.sarif
        category: trivy-app

    - name: Upload OSV-Scanner SARIF to GitHub Security tab
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 #v2.25.6
      with:
        sarif_file: ${{ inputs.project-directory }}/osv-scanner-app.sarif
        category: osv-scanner-app

    - name: Upload SARIF artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: sca-scan-sarif-report
        path: ${{ steps.run.outputs.sarif-path }}
        retention-days: 30
