name: Static Application Security Testing (SAST)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # weekly scan, every Monday 02:00 UTC

jobs:
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for uploading SAST results to github security
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run SAST pipeline
        uses: ./.github/actions/sast
        # Local use defaults toolkit-repository/toolkit-ref to this repo at
        # this commit (see action.yml). External repos would instead pin:
        #   with:
        #     toolkit-repository: your-org/mip-devsecops-pipelines
        #     toolkit-ref: v1.0.0
