name: SAST

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SAST action
        id: sast
        uses: ./.github/actions/sast-scan
        with:
          # Mandatory: project path to scan, relative to repo root.
          project: ./test-golang
          # Optional: exclude patterns, relative to `project` (not repo root).
          opengrep_exclude: "*.sarif go.sum ./test-golang/internal/execution/runner_docker.go runner_host.go"
          # Optional: fully replaces the default ruleset list when set --
          # uncomment to scope this caller to just a Go-focused ruleset.
          # semgrep_config_rulesets: "semgrep-rules/generic semgrep-rules/bash auto"