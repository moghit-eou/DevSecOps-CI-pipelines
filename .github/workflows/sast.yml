name: SAST

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"   # weekly, Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SAST action
        id: sast
        uses: ./.github/actions/sast-scan
        with:
          project: ./test-golang
          opengrep_exclude: "*.sarif go.sum ./test-golang/internal/execution/runner_docker.go"
