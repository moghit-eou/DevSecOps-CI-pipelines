name: Container Vulnerability Scanning

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # weekly scan, every Monday 02:00 UTC

jobs:
  container-scan:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for uploading results to github security
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Container Scanning pipeline
        uses: ./.github/actions/container-scan
        with:
          project-directory: mip-backend-maven
          image-name: platform-backend:testing
