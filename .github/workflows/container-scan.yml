name: Container Vulnerability Scanning

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  container-scan:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run container scan
        uses: ./.github/actions/container-scan
        with:
          # Mandatory: directory containing the Dockerfile to build & scan.
          dockerfile_path: ./test-mip-maven
          # Optional: tag for the built image.
          image_name: test-mip-maven:scan