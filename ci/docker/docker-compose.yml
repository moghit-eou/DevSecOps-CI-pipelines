# ci/docker/docker-compose.yml
#
# Local, Docker-based reproduction of all three CI pipelines. Each service
# is its own image (built from a distinct `target` in ci/docker/Dockerfile),
# its own env file, and points PROJECT_DIR at whichever local checkout you
# want to scan -- this is what keeps the three pipelines from stepping on
# each other's env vars.
#
# Usage (run from the REPO ROOT, not from ci/docker/):
#   PROJECT_DIR=./mip-backend-maven docker compose -f ci/docker/docker-compose.yml run --rm sca
#   PROJECT_DIR=./mip-backend-golang docker compose -f ci/docker/docker-compose.yml run --rm sast
#   PROJECT_DIR=./mip-backend-maven docker compose -f ci/docker/docker-compose.yml run --rm container-scan
#
# Prefer the `toolbox.sh` wrapper day-to-day (it sets PROJECT_DIR, resolves
# the docker.sock group for you, and gives you `toolbox.sh sast ./my-app`
# instead of the compose invocation above) -- this file is here for anyone
# who wants a pure docker-compose / IDE "run configuration" workflow
# instead, or to wire scanning into a docker-compose-based dev stack.
#
# All three services build from the SAME Dockerfile using a different
# `target`, so `docker compose build` builds all of them with correct
# layer caching and stage ordering in one shot.

x-project-mount: &project-mount
  - type: bind
    source: ${PROJECT_DIR:-../..}
    target: /workspace

services:
  sast:
    build:
      context: ../..
      dockerfile: ci/docker/Dockerfile
      target: sast-toolbox
    image: mip-toolbox:sast
    env_file: env/sast.env
    working_dir: /workspace
    volumes: *project-mount

  sca:
    build:
      context: ../..
      dockerfile: ci/docker/Dockerfile
      target: sca-toolbox
    image: mip-toolbox:sca
    env_file: env/sca.env
    working_dir: /workspace
    volumes: *project-mount

  container-scan:
    build:
      context: ../..
      dockerfile: ci/docker/Dockerfile
      target: container-scan-toolbox
    image: mip-toolbox:container-scan
    env_file: env/container-scan.env
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${PROJECT_DIR:-../..}
        target: /workspace
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    group_add:
      # GID of the host's docker socket -- override in a .env file next to
      # this compose file if it isn't 999 on your system, e.g.:
      #   echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" > ci/docker/.env
      - "${DOCKER_GID:-999}"
